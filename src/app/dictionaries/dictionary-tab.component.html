<div class="tab-wrapper">

  <div class="loading" *ngIf="loading()">Wczytywanie…</div>

  <table mat-table [dataSource]="data()" class="mat-elevation-z2">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nazwa</th>
      <td mat-cell *matCellDef="let row">
        <ng-container *ngIf="editingId() === row.id; else readName">
          <mat-form-field appearance="outline" style="width: 100%">
            <input matInput placeholder="Nazwa" [formControl]="form.controls.name" />
            <mat-error *ngIf="form.controls.name.hasError('required')">Nazwa jest wymagana</mat-error>
            <mat-error *ngIf="form.controls.name.hasError('notUnique')">Nazwa musi być unikalna</mat-error>
          </mat-form-field>
        </ng-container>
        <ng-template #readName>{{ row.name }}</ng-template>
      </td>
    </ng-container>

    <ng-container *ngIf="kind === 'squads'" matColumnDef="tribeId">
      <th mat-header-cell *matHeaderCellDef>Tribe</th>
      <td mat-cell *matCellDef="let row">
        <ng-container *ngIf="editingId() === row.id; else readTribe">
          <mat-form-field appearance="outline" style="width: 100%">
            <mat-select placeholder="Tribe" [formControl]="form.controls.tribeId">
              <mat-option *ngFor="let t of tribesOptions()" [value]="t.id">{{ t.name }}</mat-option>
            </mat-select>
          </mat-form-field>
        </ng-container>
        <ng-template #readTribe>
          {{ tribeNameById(row.tribeId) }}
        </ng-template>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Akcje</th>
      <td mat-cell *matCellDef="let row">
        <div class="cell-actions">
          <ng-container *ngIf="editingId() === row.id; else normalActions">
            <button mat-stroked-button color="primary" (click)="save()" [disabled]="form.invalid">Zapisz</button>
            <button mat-stroked-button color="basic" (click)="cancel()">Anuluj</button>
          </ng-container>
          <ng-template #normalActions>
            <button mat-stroked-button color="primary" (click)="beginEdit(row)">Edytuj</button>
            <button mat-stroked-button color="warn" (click)="remove(row)">Usuń</button>
          </ng-template>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <!-- Add button under the list (visible only when not adding) -->
  <div class="footer" *ngIf="!isAdding()">
    <button mat-raised-button color="primary" (click)="beginAdd()">Dodaj</button>
  </div>

  <!-- Add new row form -->
  <div class="form" *ngIf="isAdding()">
    <form [formGroup]="form" (ngSubmit)="save()" novalidate>
      <mat-form-field appearance="outline" style="width: 360px">
        <mat-label>Nazwa</mat-label>
        <input matInput [formControl]="form.controls.name" required />
        <mat-error *ngIf="form.controls.name.hasError('required')">Nazwa jest wymagana</mat-error>
        <mat-error *ngIf="form.controls.name.hasError('notUnique')">Nazwa musi być unikalna</mat-error>
      </mat-form-field>
      <ng-container *ngIf="kind === 'squads'">
        <mat-form-field appearance="outline" style="width: 240px">
          <mat-label>Tribe</mat-label>
          <mat-select [formControl]="form.controls.tribeId" required>
            <mat-option *ngFor="let t of tribesOptions()" [value]="t.id">{{ t.name }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.controls.tribeId.hasError('required')">Wybierz Tribe</mat-error>
        </mat-form-field>
      </ng-container>
      <div class="actions">
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Zapisz</button>
        <button mat-stroked-button type="button" (click)="cancel()">Anuluj</button>
      </div>
    </form>
  </div>
</div>
