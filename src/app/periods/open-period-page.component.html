<section class="open-period-page">
  <div class="page-header">
    <h2 class="page-title">Lista pracowników w otwartym okresie</h2>
    <div class="actions-spacer"></div>
    <div class="actions-right">
      <button mat-stroked-button color="primary" (click)="reload()" [disabled]="generating()">Odśwież</button>
    </div>
  </div>
  <div class="page-content">
    <app-open-period-viewer [period]="period()" (delete)="onDelete($event)" (edit)="onEdit($event)"></app-open-period-viewer>
  </div>
  <div class="bottom-actions" *ngIf="period() as p">
    <button mat-raised-button color="accent" (click)="closeAndGenerate()" [disabled]="generating() || loading() || !period()" class="generate-btn">
      <mat-icon *ngIf="!generating()">lock</mat-icon>
      <mat-progress-spinner *ngIf="generating()" diameter="18" mode="indeterminate"></mat-progress-spinner>
      <span class="btn-text" *ngIf="!generating()">Zamknij i generuj nowy okres</span>
      <span class="btn-text" *ngIf="generating()">Przetwarzanie...</span>
    </button>
  </div>
</section>
